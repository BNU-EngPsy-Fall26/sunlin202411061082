(function(root){

function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

function fpsSchedule(seed,practice=false){

  // the old five-cell cycle. Pseudorandom schedules remain reproducible by seed.

  if(practice){
    // A short practice covers different positions, with an even left/right mix.
    const sideChoices=shuffle([...Array(6).fill(0),...Array(6).fill(1)],r);

    return shuffle(conditions.map((c,i)=>({...c,rep:0,targetCell:sideChoices[i]?rp.pop():lp.pop()})),r);

  // five times, with 2/3 vs 3/2 targets in the two cue regions.
  const sideCounts=shuffle([...Array(6).fill(2),...Array(6).fill(3)],r);
  const locations=conditions.map(()=>[]);

    const cells=side===0?left:right;
    let assigned=false;

      const counts=new Map(cells.map(c=>[c,2]));
      for(const extra of shuffle(cells,r).slice(0,6))counts.set(extra,3);

function consent(kind){setPage('consent');app.innerHTML=`<section class="panel consent-card"><div class="eyebrow">BEFORE WE START</div><h1 style="font-size:29px">准备好，开始你的任务。</h1><p>本任务用于工程心理学课程，记录匿名编号、反应时间、作答、实验条件与窗口中断情况。不收集姓名、学号、摄像头或位置。数据先保存在本浏览器，可导出交给研究者；只有另行点击上传才发送至配置的课程接口。</p><p>任务包含时间压力与视觉判断，你可随时停止参与。结果只反映本任务表现，不用于诊断或评价个人能力。</p><div class="field"><label for="participant">匿名编号</label><input id="participant" type="text" value="${esc(read('citylab.participant',''))}" placeholder="例如 P01（不填姓名或学号）" maxlength="24" autocomplete="off"><span class="muted">请使用研究者分配的编号，两个任务使用同一编号。</span></div><label class="checkbox"><input id="consent" type="checkbox"><span>我已阅读说明，自愿参加，理解可以随时退出。</span></label><div class="note">本实验已关联课程项目码 J5J9UJ。请填写匿名编号、勾选知情同意后开始练习。</div><div class="actions"><button class="primary" id="begin-formal">开始练习 →</button><button class="secondary" data-demo="${kind}">快速体验</button><button class="text-btn" data-intro="${kind}">返回说明</button></div><div id="form-error" role="alert" class="setting-status"></div></section>`;bind();document.querySelector('#begin-formal').onclick=()=>{let p=document.querySelector('#participant').value.trim();if(!/^[A-Za-z0-9_-]{1,24}$/.test(p)){document.querySelector('#form-error').textContent='请用1—24位英文字母、数字、下划线或短横线填写匿名编号。';return}if(!document.querySelector('#consent').checked){document.querySelector('#form-error').textContent='请先阅读并勾选自愿参与。';return}try{localStorage.setItem('citylab.participant',JSON.stringify(p))}catch{}start(kind,false,p)};}
function start(kind,demo,participant='DEMO'){if(innerWidth<850||innerHeight<580){toast('计时任务需要较大的电脑窗口（至少850×580）。');return}clearTimer();let seed=E.hash(participant),now=new Date().toISOString(),sessionId=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${seed}-${Math.random()}`),fpsSeed=E.hash(participant+'|'+sessionId);run={id:sessionId,version:E.VERSION,participant,experiment:kind,demo,seed,fpsSeed,started:now,completed:false,consent:!demo,config:{...config},rows:[],phase:demo?'demo':'practice',idx:0,stage:'ready',invalids:0,overallOrder:sessions.filter(s=>s.participant===participant&&!s.demo&&s.completed).map(s=>s.experiment).concat(kind).join('>')};run.queue=makeQueue(kind,kind==='fps'?run.fpsSeed:seed,run.phase);if(!demo){sessions.push(run);persist()}setPage('game');gameShell();ready()}
function makeQueue(kind,seed,phase){if(kind==='fps'){let a=E.fpsSchedule(seed,phase!=='formal');return phase==='demo'?a.slice(0,3):phase==='practice'?a.slice(0,6):a}let a=E.navSchedule(seed,phase!=='formal');if(phase!=='formal')a=a.filter(t=>['left','straight','right'].indexOf(t.turn)===((t.heading/90+['north','heading','aided'].indexOf(t.mode))%3));return phase==='demo'?a.filter((_,i)=>i%4===0):phase==='practice'?a.filter((_,i)=>i%2===0):a}
function gameShell(){let r=run;app.innerHTML=`<div class="task-header"><div class="task-title"><span class="tag">${r.phase==='demo'?'体验模式':r.phase==='practice'?'练习阶段':'正式任务'}</span><h2>${labels[r.experiment]}</h2></div><button class="text-btn" id="exit-run">退出任务</button></div><div class="progress"><div id="progress-fill"></div></div><div class="game-layout"><div><div class="arena ${r.experiment==='fps'?'fps-arena':'nav-arena'}" id="arena"></div><div class="game-foot"><span id="trial-counter"></span><span>保持当前窗口可见 · 首次作答有效</span></div></div><aside class="game-side"><div class="eyebrow">MISSION CONTROL</div><h3 style="margin-top:22px">${r.experiment==='fps'?'唯一目标':'配送任务'}</h3>${r.experiment==='fps'?'<div class="legend-row"><span class="dot-target"></span>橙色圆形靶子</div><p class="muted">点击中央准星后等待靶子出现。第一次点击即结束本轮。</p>':'<div class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd></div><p class="muted">相对于骑手：<br>左转 · 直行 · 右转</p><div class="note" id="order-info"></div>'}<hr><span class="muted">当前显示</span><p id="condition-label" style="font-size:13px;color:#435d35"></p><hr><span class="muted">任务进度</span><div class="big" id="side-progress"></div><p class="muted">${r.phase==='demo'?'不保存为正式数据':`编号 ${esc(r.participant)}`}</p></aside></div>`;document.querySelector('#exit-run').onclick=exitRun;}
function updateProgress(){let r=run;if(r.experiment==='nav'){let names=['银杏公寓','书店街','湖畔办公楼','梧桐社区','艺术中心','南门宿舍'];document.querySelector('#order-info').textContent='订单 '+String(Math.floor(r.idx/12)+1).padStart(2,'0')+' · 送往'+names[Math.floor(r.idx/12)%6];}document.querySelector('#progress-fill').style.width=`${r.idx/r.queue.length*100}%`;document.querySelector('#trial-counter').textContent=`${r.phase==='practice'?'练习':r.phase==='demo'?'体验':'正式'} ${Math.min(r.idx+1,r.queue.length)} / ${r.queue.length} ${r.invalids?'· 已补做中断试次 '+r.invalids:''}`;document.querySelector('#side-progress').textContent=`${r.idx} / ${r.queue.length}`;let t=r.queue[r.idx];document.querySelector('#condition-label').textContent=r.experiment==='fps'?(t.cue==='valid'?'可靠区域提示':'中性提示'):labels[t.mode]}
function ready(){if(!run)return;clearTimer();if(run.idx>=run.queue.length){phaseEnd();return}run.stage='ready';run.trial=run.queue[run.idx];updateProgress();let arena=document.querySelector('#arena');if(run.experiment==='fps'){arena.innerHTML='<span class="arena-label">SEARCH RANGE / READY</span><button class="ready-btn" id="ready-trial" aria-label="准备本轮">＋</button><div class="ready-copy">点击中央准星，开始本轮</div>';document.querySelector('#ready-trial').onclick=()=>cue();}else{arena.innerHTML=`<div class="center-state"><span class="tag">${labels[run.trial.mode]}</span><h2>${run.idx===0?'接取城市配送订单':'前往下一路口'}</h2><p>${run.phase==='formal'?`配送段 ${Math.floor(run.idx/12)+1} · 路口 ${run.idx%12+1}`:'先熟悉地图与操作'}<br>准备后才显示本轮路线，请按骑手视角判断。</p><button class="primary" id="ready-trial">按空格出发 →</button><p class="muted">← 左转　↑ 直行　→ 右转</p></div>`;document.querySelector('#ready-trial').onclick=showStimulus}}

function showStimulus(){if(!run||!['cue','ready'].includes(run.stage))return;run.stage='rendering';raf=requestAnimationFrame(()=>{let arena=document.querySelector('#arena'),t=run.trial;if(run.experiment==='fps'){run.items=E.targets(t,(run.fpsSeed??run.seed)+run.idx*119);arena.innerHTML='<span class="arena-label">IDENTIFY / ORANGE CIRCLE</span>'+run.items.map(p=>`<button disabled tabindex="-1" class="target ${p.kind}" data-cell="${p.cell}" style="left:${8+p.x*84}%;top:${14+p.y*76}%" aria-label="${p.kind==='orangeCircle'?'橙色圆形':p.kind==='orangeSquare'?'橙色方形':'蓝色圆形'}"></button>`).join('');arena.onpointerdown=e=>{if(run?.stage!=='active'||e.button!==0)return;let rect=arena.getBoundingClientRect(),b=e.target.closest('[data-cell]'),cell=b?+b.dataset.cell:-1;respond(cell===t.targetCell,cell,{clickX:(e.clientX-rect.left)/rect.width,clickY:(e.clientY-rect.top)/rect.height})};}else{arena.onpointerdown=null;arena.innerHTML=navSVG(t)}if(!run||run.stage!=='rendering')return;run.startedAt=performance.now();run.stage='active';arena.querySelectorAll('.target').forEach(b=>b.disabled=false);timer=setTimeout(()=>respond(false,'timeout',{},true),run.demo?60000:(run.experiment==='fps'?8000:10000));})}
function navSVG(t){const rot=t.mode==='heading'?-t.heading:0;let road='';for(let v of [95,235,375,515])road+=`<path d="M${v} 0V600M0 ${v}H600" stroke="#fffdf5" stroke-width="30"/><path d="M${v} 0V600M0 ${v}H600" stroke="#d8ddce" stroke-width="1" stroke-dasharray="7 9"/>`;const r=E.rng(run.seed+t.scene*71),palette=['#c6d2b9','#d7cfb9','#cad5c4','#d4d9bd'];let buildings='';for(let x of [23,123,263,403,543])for(let y of [23,123,263,403,543]){let w=48+r()*24,h=42+r()*24;buildings+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${palette[Math.floor(r()*4)]}"/><rect x="${x+7}" y="${y+7}" width="${w-14}" height="${h-14}" rx="4" fill="none" stroke="#ffffff50"/>`}
const center=375, exit=E.turnHeading(t.heading,t.turn),vec=h=>({x:Math.sin(h*Math.PI/180),y:-Math.cos(h*Math.PI/180)}),a=vec(t.heading),b=vec(exit),end={x:center+b.x*100,y:center+b.y*100};let compass='';if(t.mode==='aided')for(let [name,h]of[['前',t.heading],['左',(t.heading+270)%360],['右',(t.heading+90)%360]]){let v=vec(h);compass+=`<g transform="translate(${center+v.x*48} ${center+v.y*48})"><rect x="-13" y="-13" width="26" height="26" rx="13" fill="#ffffff" stroke="#8fa774"/><text y="5" text-anchor="middle" font-size="13" fill="#456035">${name}</text></g>`}return `<svg viewBox="0 0 620 480" role="img" aria-label="配送路口地图，${labels[t.mode]}。使用方向键判断转向。"><defs><pattern id="park" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#bdcba8"/></pattern></defs><rect width="620" height="480" fill="#e8eddf"/><g transform="translate(310 240) rotate(${rot}) translate(-375 -375)">${road}${buildings}<path d="M${center-a.x*115} ${center-a.y*115}L375 375L${end.x} ${end.y}" fill="none" stroke="#819b57" stroke-width="8" stroke-linejoin="round"/><path d="M${center-a.x*115} ${center-a.y*115}L375 375L${end.x} ${end.y}" fill="none" stroke="#e7efce" stroke-width="2" stroke-dasharray="5 7"/><circle cx="${end.x}" cy="${end.y}" r="11" fill="#e4a06a" stroke="#fff" stroke-width="3"/><g transform="translate(375 375) rotate(${t.heading})"><circle r="20" fill="#fff" stroke="#d5dfc7" stroke-width="2"/><path d="M0-15L-10 10 0 6 10 10Z" fill="#2e553d"/></g>${compass}</g><g transform="translate(567 48)"><circle r="24" fill="#fff" stroke="#d5dfc7"/><g transform="rotate(${rot})"><path d="M0-15L-6 7 0 3 6 7Z" fill="#627b4c"/><text y="-29" text-anchor="middle" fill="#627b4c" font-size="11">N</text></g></g><rect x="18" y="18" width="169" height="31" rx="6" fill="#ffffffeb"/><text x="30" y="38" fill="#5b7545" font-size="12">${labels[t.mode]}</text><rect x="18" y="430" width="260" height="31" rx="6" fill="#ffffffed"/><text x="31" y="450" fill="#647a50" font-size="11">骑手箭头 = 前方　绿色 = 路线　橙点 = 下一站</text></svg>`}
function respond(correct,response,extra={},timeout=false){if(!run||run.stage!=='active')return;let rt=performance.now()-run.startedAt;clearTimer();run.stage='feedback';let row={...run.trial,participant:run.participant,session:run.id,version:E.VERSION,experiment:run.experiment,phase:run.phase,trial:run.idx+1,correct:!!correct,response,rt:Math.round(rt*1000)/1000,timeout,invalid:false,timestamp:new Date().toISOString(),...extra};run.rows.push(row);if(!run.demo)persist();let arena=document.querySelector('#arena');arena.onpointerdown=null;let text=timeout?'本轮超时':correct?(run.experiment==='fps'?'目标命中':'转向正确'):(run.experiment==='fps'?'未命中指定目标':`正确方向：${labels[run.trial.turn]}`);if(run.experiment==='nav'){let angle=E.turnHeading(run.trial.heading,run.trial.turn)-(run.trial.mode==='heading'?run.trial.heading:0),dx=Math.sin(angle*Math.PI/180)*100,dy=-Math.cos(angle*Math.PI/180)*100;let svg=arena.querySelector('svg');svg.insertAdjacentHTML('beforeend',`<circle cx="310" cy="240" r="10" fill="#365c3b" stroke="white" stroke-width="3"><animate attributeName="cx" from="310" to="${310+dx}" dur="0.55s" fill="freeze"/><animate attributeName="cy" from="240" to="${240+dy}" dur="0.55s" fill="freeze"/></circle>`)}arena.insertAdjacentHTML('beforeend',`<div class="center-state ${run.experiment==='nav'?'nav-feedback':''}"><div class="feedback-icon ${correct?'':'bad'}">${correct?'✓':'↺'}</div><h2>${text}</h2><p>${timeout?'准备好后继续下一轮':`${Math.round(rt)} ms`}</p>${run.phase==='practice'&&!correct?`<p>${run.experiment==='nav'?'先找骑手箭头的前方，再判断路线相对它的左、直或右。':'只点击橙色圆形；橙色方形和蓝色圆形均为干扰。'}</p>`:''}</div>`);timer=setTimeout(()=>{run.idx++;if(run.idx<run.queue.length&&run.phase==='formal'&&run.idx%(run.experiment==='fps'?15:12)===0)breakScreen();else ready()},run.phase==='practice'&&!correct?1700:650)}
function breakScreen(){clearTimer();run.stage='break';let construction=run.experiment==='nav'&&run.idx%24===12;document.querySelector('#arena').innerHTML=`<div class="center-state"><span class="eyebrow">TAKE A BREATH</span><h2>${construction?'道路施工 · 配送路线已更新':'这一段任务完成了'}</h2><p>${construction?'下一段将显示更新后的路口路线。通知不计时，也无需记住旧路线。':'放松一下眼睛和手腕，准备好后再继续。'}<br>已完成 ${run.idx} / ${run.queue.length} 次。</p><button class="primary" id="continue-block">继续任务 →</button></div>`;document.querySelector('#continue-block').onclick=ready}

function report(s){setPage('report');let rows=s.demo?s.rows.map(r=>({...r,phase:'formal'})):s.rows,stats=E.summary(rows);app.innerHTML=heading(s.demo?'体验完成，感觉如何？':'你的任务报告',s.demo?'DEMO / NOT RESEARCH DATA':'MISSION COMPLETED')+`<section class="panel"><div class="section-label"><h2>${labels[s.experiment]}</h2><span>${s.demo?'DEMO':esc(s.participant)}</span></div><div class="metric-grid"><div class="metric"><span>有效正式试次${s.demo?'（体验）':''}</span><strong>${stats.n}</strong></div><div class="metric"><span>正确率</span><strong>${pct(stats.accuracy)}</strong></div><div class="metric"><span>正确反应中位数</span><strong>${num(stats.rt)} <small>ms</small></strong></div></div><p>这些结果只描述你在本任务中的表现。速度和正确率应结合解读，不代表总体注意能力或空间能力。</p>${s.demo?'<div class="note">快速体验仅3轮，条件不完整；本报告不进入正式分析，也不上传。</div>':conditionTable(s.rows,s.experiment)}<div class="actions">${!s.demo?`<button class="primary" id="upload-one" ${s.uploaded?'disabled':''}>${s.uploaded?'已提交课程平台 ✓':'提交本次数据到课程平台'}</button><button class="secondary" id="export-one">导出本次 CSV</button><button class="secondary" id="export-one-json">导出本次 JSON</button>`:''}<button class="secondary" data-intro="${s.experiment==='fps'?'nav':'fps'}">前往另一个任务 →</button><button class="text-btn" data-page="home">返回大厅</button></div></section>`;bind();if(!s.demo){document.querySelector('#upload-one').onclick=()=>upload(s,document.querySelector('#upload-one'));document.querySelector('#export-one').onclick=()=>exportCSV([s]);document.querySelector('#export-one-json').onclick=()=>download(JSON.stringify([cleanSession(s)],null,2),`citylab-${s.participant}-${s.experiment}.json`,'application/json')}}
const pct=n=>n===null?'—':`${(n*100).toFixed(1)}%`, num=n=>n===null?'—':Math.round(n);
function conditionTable(rows,kind){let groups={};for(let r of rows.filter(x=>x.phase==='formal'&&!x.invalid)){(groups[r.condition]??=[]).push(r)}let names=k=>kind==='fps'?`${labels[k.split('_')[0]]} · ${k.split('_')[1]} · ${labels[k.split('_')[2]]}`:`${labels[k.split('_')[0]]} · 朝${{0:'北',90:'东',180:'南',270:'西'}[k.split('_')[1]]}`;return `<div class="table-wrap"><table><thead><tr><th>条件</th><th>试次</th><th>正确率</th><th>正确RT中位数</th></tr></thead><tbody>${Object.keys(groups).sort().map(k=>{let s=E.summary(groups[k]);return `<tr><td>${esc(names(k))}</td><td>${s.n}</td><td>${pct(s.accuracy)}</td><td>${num(s.rt)} ms</td></tr>`}).join('')}</tbody></table></div>`}
function cleanSession(s){let {queue,trial,items,startedAt,...rest}=s;return rest}
function download(text,name,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(ss){let fields=['session','participant','version','experiment','demo','completed','overallOrder','phase','trial','condition','type','size','cue','targetCell','clickX','clickY','mode','heading','turn','scene','rep','response','rt','correct','timeout','invalid','reason','timestamp'];let rows=ss.flatMap(s=>s.rows.map(r=>({...r,session:s.id,participant:s.participant,version:s.version,experiment:s.experiment,demo:s.demo,completed:s.completed,overallOrder:s.overallOrder})));let csv='\uFEFF'+fields.join(',')+'\r\n'+rows.map(r=>fields.map(f=>{let v=String(r[f]??'');if(/^[=+@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'}).join(',')).join('\r\n');download(csv,'citylab-trials-'+new Date().toISOString().slice(0,10)+'.csv','text/csv;charset=utf-8')}
function colorBugRecord(s){return s.experiment==='fps'&&['1.0.0','1.1.0'].includes(s.version)}
function eligible(ss){let map=new Map();for(let s of ss){if(s.demo||!s.completed||colorBugRecord(s)||!['fps','nav'].includes(s.experiment))continue;let rows=s.rows.filter(r=>r.phase==='formal'&&!r.invalid),expected=s.experiment==='fps'?60:72;if(rows.length!==expected)continue;let counts={};for(let r of rows)counts[r.condition]=(counts[r.condition]||0)+1;if(Object.keys(counts).length!==12||Object.values(counts).some(n=>n!==(s.experiment==='fps'?5:6)))continue;let k=s.participant+'|'+s.experiment;if(!map.has(k)||String(s.finished)>String(map.get(k).finished))map.set(k,s)}return [...map.values()]}
function groupChart(ss,kind){let conds=kind==='fps'?['feature','conjunction']:['north','heading','aided'];let data=conds.map(c=>{let per=ss.filter(s=>s.experiment===kind).map(s=>E.summary(s.rows.filter(r=>kind==='fps'?r.type===c&&r.cue==='neutral':r.mode===c)));let vals=per.map(x=>x.rt).filter(x=>x!==null);return {name:labels[c],rt:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,acc:per.length?per.reduce((a,b)=>a+b.accuracy,0)/per.length:null}});let max=Math.max(1,...data.map(x=>x.rt||0));return `<div class="chart">${data.map(d=>`<div class="bar-row"><span>${d.name}</span><div class="bar-track"><div class="bar" style="width:${(d.rt||0)/max*100}%"></div></div><span>${num(d.rt)} ms</span></div>`).join('')}</div><p class="muted">被试内正确RT中位数 → 被试间平均。${kind==='fps'?'仅无有效提示条件。':''}</p>`}
function effectText(ss,kind){let pairs=[];for(let s of ss.filter(x=>x.experiment===kind)){let a=E.summary(s.rows.filter(r=>kind==='fps'?r.cue==='neutral':r.mode==='north'));let b=E.summary(s.rows.filter(r=>kind==='fps'?r.cue==='valid':r.mode==='aided'));if(a.rt!==null&&b.rt!==null)pairs.push(a.rt-b.rt)}if(!pairs.length)return '尚无可计算的配对数据。';let mean=pairs.reduce((a,b)=>a+b,0)/pairs.length,sd=pairs.length>1?Math.sqrt(pairs.reduce((a,b)=>a+(b-mean)**2,0)/(pairs.length-1)):0;return `${kind==='fps'?'中性提示 − 区域提示':'北向上 − 北向上＋参照'}：<strong>${Math.round(mean)} ms</strong>；配对人数 ${pairs.length}；d<sub>z</sub> ${sd?(mean/sd).toFixed(2):'不可计算'}。正值表示改进条件更快。`}
function searchPlot(ss){let groups=[];for(let type of ['feature','conjunction'])for(let size of [8,16,24]){let vals=ss.filter(s=>s.experiment==='fps').map(s=>E.summary(s.rows.filter(r=>r.type===type&&r.size===size&&r.cue==='neutral')).rt).filter(x=>x!==null);groups.push({type,size,v:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null})}if(!groups.some(x=>x.v!==null))return'';let max=Math.max(...groups.map(x=>x.v||0))*1.2;let content='';for(let type of ['feature','conjunction']){let arr=groups.filter(x=>x.type===type&&x.v!==null),color=type==='feature'?'#7a975a':'#cc986f';content+=`<polyline points="${arr.map(d=>`${70+(d.size-8)/16*380},${220-d.v/max*170}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3"/>`+arr.map(d=>`<circle cx="${70+(d.size-8)/16*380}" cy="${220-d.v/max*170}" r="5" fill="${color}"/><text x="${70+(d.size-8)/16*380}" y="${210-d.v/max*170}" text-anchor="middle" font-size="11" fill="${color}">${Math.round(d.v)}</text>`).join('')}return `<svg class="plot" viewBox="0 0 520 265" role="img" aria-label="无有效提示条件的搜索曲线"><path d="M50 35V220H475" fill="none" stroke="#b8c7a6"/><text x="10" y="22" font-size="11" fill="#78876b">RT / ms</text>${[8,16,24].map((n,i)=>`<text x="${70+i*190}" y="243" text-anchor="middle" font-size="12" fill="#78876b">${n} 个</text>`).join('')}${content}</svg><p class="muted">绿色：特征搜索；橙色：联合搜索。仅展示真实数据，不叠加伪造结果。</p>`}
function results(){setPage('results');let all=[...sessions,...imported],ok=eligible(all),participants=new Set(ok.map(s=>s.participant));app.innerHTML=heading('把表现，变成发现。','DATA / RESULTS')+`<div class="actions" style="margin:0 0 24px"><button class="primary" id="export-all">导出本机 CSV</button><button class="secondary" id="export-json">导出本机 JSON</button><button class="secondary" id="import-button">导入 CSV / JSON</button><input type="file" id="import-file" accept=".csv,.json" hidden><a class="secondary" href="https://github.com/BNU-EngPsy-Fall26/sunlin202411061082" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></div><div class="note">v1.1.1已修复射击颜色。旧版1.0.0/1.1.0射击记录保留但不纳入分析，也不再上传。正式汇总仅保留每个“编号×实验”最后一次完整且条件齐全的记录。练习、体验、未完成和中断试次不参与汇总。导入数据仅在当前页面使用，不会自动上传。</div><div class="metric-grid"><div class="metric"><span>正式被试（至少完成一项）</span><strong>${participants.size}</strong></div><div class="metric"><span>完成射击 / 完成导航</span><strong>${ok.filter(s=>s.experiment==='fps').length} <small>/</small> ${ok.filter(s=>s.experiment==='nav').length}</strong></div><div class="metric"><span>两项均完成</span><strong>${[...participants].filter(p=>ok.filter(s=>s.participant===p).length===2).length}</strong></div></div>${ok.length?`<div class="two-col"><section class="panel"><h2>目标搜寻 · 经典比较</h2>${groupChart(ok,'fps')}${searchPlot(ok)}<div class="note">${effectText(ok,'fps')}</div></section><section class="panel"><h2>城市导航 · 显示比较</h2>${groupChart(ok,'nav')}<div class="note">${effectText(ok,'nav')}</div><p>只测即时转向，不代表空间记忆或整体导航优劣。必须同时检查正确率；小样本不宜作稳定推广。</p></section></div><section class="panel"><h2>每位被试的正式结果</h2>${ok.map(s=>`<details><summary>${esc(s.participant)} · ${labels[s.experiment]} · ${pct(E.summary(s.rows).accuracy)} 正确率</summary>${conditionTable(s.rows,s.experiment)}</details>`).join('')}</section>`:`<section class="panel empty"><div class="empty-icon">⌁</div><h3>真实发现，从第一位参与者开始。</h3><p>当前没有完整的正式数据。完成实验或导入数据后，<br>这里会生成条件比较、搜索曲线与配对改进收益。</p><button class="secondary" data-page="home">回到任务大厅 →</button></section>`}<section class="panel"><h2>本机记录 <span class="muted">${sessions.filter(s=>!s.demo).length} 条</span></h2>${sessions.filter(s=>!s.demo).length?sessions.filter(s=>!s.demo).map(s=>`<div class="session-row"><div><strong>${esc(s.participant)} · ${labels[s.experiment]}</strong><small>${esc(s.started.slice(0,16).replace('T',' '))} UTC · ${s.rows.length} 条原始记录 · ${colorBugRecord(s)?'旧版颜色异常 · 不纳入分析':s.completed?'已完成':'未完成'}</small></div><div><button class="secondary" data-export="${s.id}">CSV</button> <button class="secondary" data-upload="${s.id}" ${!s.completed||!config.project||colorBugRecord(s)?'disabled':''}>${s.uploaded?'再次上传':'上传课程平台'}</button></div></div>`).join(''):'<p class="muted">暂无记录。浏览器清理数据后记录会丢失，请及时导出。</p>'}</section>`;bind();document.querySelector('#export-all').onclick=()=>exportCSV(sessions.filter(s=>!s.demo));document.querySelector('#export-json').onclick=()=>download(JSON.stringify(sessions.filter(s=>!s.demo).map(cleanSession),null,2),'citylab-sessions.json','application/json');document.querySelector('#import-button').onclick=()=>document.querySelector('#import-file').click();document.querySelector('#import-file').onchange=importFile;document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportCSV([sessions.find(s=>s.id===b.dataset.export)]));document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>upload(sessions.find(s=>s.id===b.dataset.upload),b))}
function parseCSV(text){let out=[],row=[],v='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x))out.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);out.push(row)}let head=out.shift()?.map(x=>x.replace(/^\uFEFF/,''));if(!head?.includes('session'))throw Error('请选择本网站导出的逐试次 CSV。');let map=new Map();for(let arr of out){let r=Object.fromEntries(head.map((h,i)=>[h,arr[i]??'']));for(let f of ['rt','trial','size','heading','scene','rep','targetCell','clickX','clickY'])r[f]=r[f]===''?null:Number(r[f]);for(let f of ['demo','completed','correct','timeout','invalid'])r[f]=r[f]==='true';if(!map.has(r.session))map.set(r.session,{id:r.session,participant:r.participant,experiment:r.experiment,version:r.version,demo:r.demo,completed:r.completed,finished:r.timestamp,rows:[]});map.get(r.session).rows.push(r);map.get(r.session).finished=r.timestamp}return [...map.values()]}
async function importFile(e){let f=e.target.files[0];if(!f)return;try{let text=await f.text();let data=f.name.endsWith('.csv')?parseCSV(text):JSON.parse(text);if(!Array.isArray(data)||data.some(s=>!Array.isArray(s.rows)||typeof s.participant!=='string'||!['fps','nav'].includes(s.experiment)))throw Error('文件格式不符合本网站导出格式。');for(let s of data)for(let r of s.rows){if(!r.invalid&&r.phase==='formal'&&(!Number.isFinite(r.rt)||r.rt<0||typeof r.correct!=='boolean'))throw Error('数据包含无效反应时间或正确性字段。')}imported=data;results();toast(`已导入 ${data.length} 条实验记录`)}catch(err){toast('导入失败：'+err.message)}}
async function upload(s,b){const project=s.config?.project||config.project;if(!s.completed||s.demo||!project||colorBugRecord(s)||!eligible([s]).length){toast('仅能提交完整、条件齐全的正式记录。');return}if(s.uploaded){toast('本次记录已提交，请在课程后台核对，避免重复提交。');return}if(!confirm(`将匿名编号 ${s.participant} 的${labels[s.experiment]}数据提交至课程项目 ${project}？`))return;b.disabled=true;b.textContent='正在提交，请稍候…';try{const trials=s.rows.filter(r=>r.phase==='formal').map(r=>({...r,cond:r.condition,session:s.id,version:s.version,completed:s.completed,overallOrder:s.overallOrder}));const controller=new AbortController(),timeoutId=setTimeout(()=>controller.abort(),20000);let response;try{response=await fetch('https://attention-lab-production.up.railway.app/api/hw2/submit',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({project,experiment:s.experiment==='fps'?'visual_search_cue':'map_orientation_aid',participant:s.participant,condition:'within_subject',trials})})}finally{clearTimeout(timeoutId)}if(!response.ok)throw Error('HTTP '+response.status);const body=await response.json();if(!body||body.error||body.success===false||body.ok===false)throw Error('平台未确认接收');s.uploaded=new Date().toISOString();s.uploadProject=project;persist();b.textContent='已提交课程平台 ✓';toast('提交成功！请继续另一项任务，并保存JSON备份。')}catch(e){b.disabled=false;b.textContent='未确认提交成功 · 重试';toast('未确认上传成功。请保留页面、导出JSON，并联系研究者核对后台后再重试。')}}
function research(){setPage('research');app.innerHTML=heading('游戏背后，是可以检验的问题。','RESEARCH / DESIGN')+`<div class="note">精简版：按研究者要求将所有试次减半。射击细分组合各5次，导航各6次，低于课程截图“每条件至少10次”；提交时需如实说明。这是经典范式的游戏化改编，用于复现核心比较。刺激、鼠标点击和导航场景并非原论文全部程序的逐项复制。预测为待研究者确认的草案，不是已经得到的结论。</div><div class="two-col"><section class="panel"><span class="tag">W6 / 特征整合与视觉搜索</span><h2>01　目标搜寻行动</h2><p>单一颜色即可区分目标，或需要结合颜色与形状区分目标。检验两类搜索在项目数量增加时的反应时变化。</p><table><tr><th>因素</th><th>条件</th></tr><tr><td>搜索类型</td><td>特征 / 联合</td></tr><tr><td>项目总数</td><td>8 / 16 / 24（包含目标）</td></tr><tr><td>新增提示</td><td>中性 / 可靠半区提示</td></tr><tr><td>试次数</td><td>12组合 × 5 = 60；另6次练习</td></tr></table><h3>预测草案</h3><p>无有效提示时，联合搜索的反应时间随项目数量增加得更多。区域提示可能减少搜索时间，在联合搜索中收益可能更明显。</p><p>目标始终存在，每轮首次点击结束。反应时间包含搜索、决策和鼠标移动；结果不能被称作“纯搜索时间”。目标位置在条件间匹配，显示区尺寸、靶子大小保持一致。</p><a class="source-link" href="https://doi.org/10.1016/0010-0285(80)90005-5" target="_blank" rel="noopener">Treisman & Gelade (1980) ↗</a></section><section class="panel"><span class="tag">W8 / 地图朝向与空间认知</span><h2>02　城市配送行动</h2><p>在配送路口片段中判断以骑手为中心的下一步转向，比较不同地图显示。使用虚构场景，不要求自由驾驶或背诵订单。</p><table><tr><th>因素</th><th>条件</th></tr><tr><td>地图模式</td><td>北向上 / 航向上 / 北向上＋参照</td></tr><tr><td>实际朝向</td><td>北 / 东 / 南 / 西</td></tr><tr><td>作答平衡</td><td>每组合左、直、右各2次</td></tr><tr><td>试次数</td><td>12组合 × 6 = 72；另6次练习</td></tr></table><h3>预测草案</h3><p>即时转向任务中，航向上可能减少方向转换成本；北向上在骑手朝向与地图上方不一致时可能更慢。局部方向参照可能改善北向上的判断表现。</p><p>本任务不测认知地图学习，因此不能据此比较整体导航能力。每12次可休息；施工通知在判断之间显示，不单独操纵施工效应。</p><a class="source-link" href="https://doi.org/10.1177/001872089103300107" target="_blank" rel="noopener">Aretz (1991) ↗</a></section></div><section class="panel"><h2>收数与分析规则</h2><table><tr><th>项目</th><th>预先确定的规则</th></tr><tr><td>样本</td><td>至少5名他人，尽量每人完成两项任务。5人是课程下限，不保证稳定效应。</td></tr><tr><td>顺序</td><td>研究者交替安排两项实验顺序；导航模式顺序按匿名编号种子从6种排列选取，需核对样本中是否均衡。</td></tr><tr><td>窗口中断</td><td>当前试次标记无效并移至后续补做。原始记录保留；不要把中断当作错误试次。</td></tr><tr><td>反应时间</td><td>仅分析正式、未中断、正确、未超时且RT≥150ms的试次。FPS上限8秒，导航10秒。时限需预试确认并在收数前固定。</td></tr><tr><td>正确率</td><td>所有未中断正式试次为分母，错误与超时计入错误。不能因为错误而删除被试。</td></tr><tr><td>重复完成</td><td>按编号×实验保留最后一次完整、12条件试次齐全的记录。未完成和体验记录不纳入。</td></tr><tr><td>汇总</td><td>每人每条件先计算正确RT中位数，再在被试间平均；同时报告正确率。配对差值以被试为单位。</td></tr><tr><td>原文比较</td><td>对照经典效应方向，不直接把游戏RT与原论文绝对RT等同。研究者收数后填写讨论，不能预写显著结果。</td></tr></table><div class="note">目前没有真实样本结论。研究者需在课程GitHub仓库收数前提交预测；网站上的“确认”只解锁操作，不能替代事前commit。</div><div class="actions"><button class="primary" data-page="settings">确认研究准备 →</button><a class="secondary" href="https://github.com/BNU-EngPsy-Fall26/sunlin202411061082" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></div></section>`;bind()}
function settings(){setPage('settings');app.innerHTML=heading('研究准备与数据连接','RESEARCHER / SETUP')+`<section class="panel settings-form"><h2>研究准备核对（不影响被试开始任务）</h2><p>请先完成预试，阅读实验设计，并由你本人确定预测和研究决策。收数前将最终预测提交到课程GitHub仓库。这里的确认只保存在当前浏览器，不构成预注册，也不会限制被试开始任务。</p><label class="checkbox"><input id="approved" type="checkbox" ${config.approved?'checked':''}><span>我已核对设计、时限和预测，完成必要预试，并将在正式收数前留下GitHub提交记录。</span></label><div class="field"><label for="project">课程项目码（已固定）</label><input id="project" type="text" maxlength="6" readonly value="${esc(PROJECT_CODE)}"><span class="muted">项目 J5J9UJ 已绑定本实验，参与者无需填写；不要将后台下载密钥上传到 GitHub。</span></div><div class="note">不填项目码仍可完成实验并导出 CSV / JSON。上传按钮仅对完整正式记录开放；每项结束后点击提交并确认，成功后会显示“已提交”。接口按课程示例接入；请用一次真实预试核对后台，不要上传模拟数据。</div><button class="primary" id="save-settings">保存设置</button> <button class="secondary" id="invite">生成被试链接</button><div id="invite-output"></div><span class="setting-status" id="settings-status"></span><hr style="border:0;border-top:1px solid #e1e6da;margin:28px 0"><h3>交付与分享</h3><p>将此单文件 index.html 上传到课程 GitHub 仓库根目录即可运行，不需要单独上传 CSS 或 JavaScript 文件。当前Sites链接的可访问范围由站点分享设置决定；正式招募前请用另一个账号检查可访问性。</p><a class="secondary" href="https://github.com/BNU-EngPsy-Fall26/sunlin202411061082" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></section>`;bind();document.querySelector('#invite').onclick=()=>{let u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('study','1');if(config.project)u.searchParams.set('project',config.project);document.querySelector('#invite-output').innerHTML='<div class="field"><label>复制此链接给被试（已启用正式入口）</label><input type="text" readonly value="'+esc(u.href)+'"><span class="muted">此链接不改变站点访问权限；请先检查被试能否打开。</span></div>';};document.querySelector('#save-settings').onclick=()=>{let p=document.querySelector('#project').value.trim().toUpperCase();if(p&&!/^[A-Z0-9]{6}$/.test(p)){toast('项目码应为6位字母或数字。');return}config={project:PROJECT_CODE,approved:document.querySelector('#approved').checked,confirmedAt:new Date().toISOString(),version:E.VERSION};try{localStorage.setItem('citylab.config',JSON.stringify(config));toast('设置已保存到本浏览器。')}catch{toast('保存失败，请检查浏览器存储设置。')}}}

</script><script>
/* Analysis UI, kept separate from the experimental presentation/response code. */
(function(){
const S=LabStats;let active='overview';
const fmt=(v,d=1)=>S.finite(v)?v.toFixed(d):'—',interval=c=>c.low===null?'样本不足':`[${fmt(c.low)}, ${fmt(c.high)}]`;
const names={feature:'特征',conjunction:'联合',neutral:'中性',valid:'区域提示',north:'北向上',heading:'航向上',aided:'北向上＋参照'};
const conditionName=k=>{let p=k.split('_');return p.length===3?`${names[p[0]]} / ${p[1]}个 / ${names[p[2]]}`:`${names[p[0]]} / 朝${{0:'北',90:'东',180:'南',270:'西'}[p[1]]}`};
function empty(title,detail='完成或导入真实正式数据后自动生成。'){return `<div class="analysis-empty"><span>⌁</span><h3>${title}</h3><p>${detail}</p></div>`}
function sectionTitle(n,title,sub){return `<div class="analysis-title"><span>${n}</span><div><h2>${title}</h2><p>${sub}</p></div></div>`}
function effectCard(c){return `<div class="effect-card"><span class="muted">${esc(c.name)}</span><strong>${fmt(c.mean)} <small>${c.unit}</small></strong><span>配对 n=${c.n} · 95% CI ${interval(c)}</span><span>d<sub>z</sub> ${fmt(c.dz,2)} · 正差 ${c.positive} / 负差 ${c.negative} / 持平 ${c.tied}</span></div>`}
function pairedPlot(c){if(!c.n)return empty('尚无完整配对','同一被试两侧都有可分析成绩，才会进入这张图。');let values=c.pairs.flatMap(p=>[p.a,p.b]),lo=Math.min(...values),hi=Math.max(...values);let pad=Math.max(50,(hi-lo)*.2);lo=Math.min(0,lo-pad);hi+=pad;const y=v=>210-(v-lo)/(hi-lo)*170;return `<svg class="plot" viewBox="0 0 500 265" role="img" aria-label="${esc(c.name)}被试配对图"><path d="M65 30V220H440" stroke="#cad4bc" fill="none"/>${[0,.5,1].map(q=>{let v=lo+q*(hi-lo);return `<text x="55" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#849374">${Math.round(v)}</text><path d="M65 ${y(v)}H440" stroke="#e9eee1"/>`}).join('')}${c.pairs.map((p,i)=>{let col=p.diff>=0?'#789653':'#c28b68',j=(i%7-3)*3;return `<g><title>${esc(p.participant)}: ${fmt(p.a)} → ${fmt(p.b)} ${c.unit}</title><path d="M${150+j} ${y(p.a)}L${360+j} ${y(p.b)}" stroke="${col}" opacity=".6"/><circle cx="${150+j}" cy="${y(p.a)}" r="4" fill="${col}"/><circle cx="${360+j}" cy="${y(p.b)}" r="4" fill="${col}"/></g>`}).join('')}<text x="150" y="245" text-anchor="middle" font-size="11" fill="#60714d">比较左侧 A</text><text x="360" y="245" text-anchor="middle" font-size="11" fill="#60714d">比较右侧 B</text></svg><p class="muted">${esc(c.name)}；差值=A−B。一条线代表一人，绿色为正差，橙色为负差。悬停查看编号与数值。</p>`}
function linePlot(series,xs,unit,xlabels){let populated=series.some(s=>s.values.some(c=>c.mean!==null));if(!populated)return empty('等待真实条件曲线');let values=series.flatMap(s=>s.values.flatMap(c=>c.mean===null?[]:[c.mean,c.low??c.mean,c.high??c.mean]));let lo=Math.min(0,...values),hi=Math.max(...values,1);hi+=(hi-lo)*.12;const xx=i=>65+i*(445/(xs.length-1)),yy=v=>215-(v-lo)/(hi-lo)*175;return `<svg class="plot" viewBox="0 0 580 270" role="img" aria-label="条件曲线，纵轴${unit}"><text x="12" y="22" font-size="11" fill="#81916e">${unit}</text><path d="M50 35V215H535" fill="none" stroke="#becbae"/>${[0,.5,1].map(q=>{let v=lo+(hi-lo)*q;return `<path d="M50 ${yy(v)}H535" stroke="#edf0e7"/><text x="43" y="${yy(v)+4}" font-size="10" text-anchor="end" fill="#8a977b">${Math.round(v)}</text>`}).join('')}${series.map(s=>{let valid=s.values.map((c,i)=>({...c,i})).filter(c=>c.mean!==null);return `<polyline points="${valid.map(c=>`${xx(c.i)},${yy(c.mean)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dashed?'stroke-dasharray="6 4"':''}/>${valid.map(c=>`<g><title>${esc(s.name)} · ${esc(xlabels[c.i])}: ${fmt(c.mean)} ${unit}; n=${c.n}; CI ${interval(c)}</title>${c.low!==null?`<path d="M${xx(c.i)} ${yy(c.low)}V${yy(c.high)}M${xx(c.i)-4} ${yy(c.low)}h8M${xx(c.i)-4} ${yy(c.high)}h8" stroke="${s.color}" opacity=".5"/>`:''}<circle cx="${xx(c.i)}" cy="${yy(c.mean)}" r="4" fill="${s.color}"/></g>`).join('')}`}).join('')}${xlabels.map((x,i)=>`<text x="${xx(i)}" y="241" text-anchor="middle" font-size="11" fill="#7b8d65">${esc(x)}</text>`).join('')}</svg><div class="chart-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}${s.dashed?' · 虚线':''}</span>`).join('')}</div><p class="muted">点=被试间平均；误差线=95% t区间（n≥2）。不同点的有效人数可能不同，详见条件表。缺失点不解释为零。</p>`}
function groupTable(groups){return `<div class="table-wrap"><table><thead><tr><th>条件</th><th>RT有效人数</th><th>平均中位RT / ms</th><th>被试间SD</th><th>95% CI</th><th>正确率</th><th>RT可用试次/全部</th></tr></thead><tbody>${groups.map(c=>`<tr><td>${esc(conditionName(c.key))}</td><td>${c.rt.n}</td><td>${fmt(c.rt.mean)}</td><td>${fmt(c.rt.sd)}</td><td>${interval(c.rt)}</td><td>${fmt(c.accuracy.mean)}%</td><td>${c.usable}/${c.raw}</td></tr>`).join('')}</tbody></table></div>`}
function effectTable(cs){return `<div class="table-wrap"><table><thead><tr><th>配对比较（A−B）</th><th>n</th><th>平均差</th><th>95%差值CI</th><th>d<sub>z</sub></th><th>正/负/零</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.n}</td><td>${fmt(c.mean)} ${c.unit}</td><td>${interval(c)}</td><td>${fmt(c.dz,2)}</td><td>${c.positive}/${c.negative}/${c.tied}</td></tr>`).join('')}</tbody></table></div>`}
function interpretation(c){if(!c.n)return'没有足够的完整配对，暂不解释方向。';let direction=c.mean>0?'正':c.mean<0?'负':'零';let uncertain=c.n<2?'只有一名被试，不能估计组水平区间。':c.low<=0&&c.high>=0?'区间包含0，方向与大小仍有较大不确定性。':'当前t区间不包含0，但不能仅据此认定改进稳定有效。';return `当前平均差为${direction}（${fmt(c.mean)} ${c.unit}），${c.positive}/${c.n}人的差值为正。${uncertain}这是数据描述；需结合正确率、样本量及预先预测判断。`}
function fpsPanel(ss,cs){let fs=ss.filter(s=>s.experiment==='fps'),groups=S.cellGroups(ss,'fps');let series=[];for(let type of ['feature','conjunction'])for(let cue of ['neutral','valid'])series.push({name:`${names[type]} / ${names[cue]}`,color:type==='feature'?(cue==='neutral'?'#5e8246':'#a8bc83'):(cue==='neutral'?'#be855e':'#e0b899'),dashed:cue==='valid',values:[8,16,24].map(size=>groups.find(g=>g.key===`${type}_${size}_${cue}`).rt)});let classic=cs.find(c=>c.id==='slope-cost'),gain=cs.find(c=>c.id==='cue-conjunction'),acc=cs.find(c=>c.id==='accuracy-gain'&&c.kind==='fps');return sectionTitle('01','射击搜索：寻找速度如何改变？','经典比较、集合大小斜率与区域提示收益')+`<div class="analysis-metrics">${effectCard(cs.find(c=>c.id==='search-cost'))}${effectCard(classic)}${effectCard(gain)}</div><div class="two-col"><section class="panel"><h3>搜索曲线 · 项目数 × 搜索类型 × 提示</h3>${linePlot(series,[8,16,24],'RT / ms',['8个','16个','24个'])}</section><section class="panel"><h3>联合搜索 · 提示前后配对</h3>${pairedPlot(gain)}</section></div><section class="panel"><h3>每个人的搜索斜率</h3><p>对每名被试，用8、16、24个项目的正确RT中位数拟合直线。斜率单位为ms/项目；只有三个集合大小均有有效RT才估计。三个点不足以验证严格线性。</p>${fs.length?`<div class="table-wrap"><table><tr><th>编号</th><th>特征/中性</th><th>联合/中性</th><th>特征/提示</th><th>联合/提示</th></tr>${fs.map(s=>`<tr><td>${esc(s.participant)}</td>${['neutral','valid'].flatMap(cue=>['feature','conjunction'].map(type=>`<td>${fmt(S.searchSlope(s,type,cue),2)}</td>`)).join('')}</tr>`).join('')}</table></div>`:empty('尚无个人斜率')}</section><div class="two-col"><section class="panel"><h3>正确率也要一起看</h3>${effectCard(acc)}<p>正确率收益=区域提示−中性提示。反应更快但正确率下降时，不能简单解释为效率全面提升。</p></section><section class="panel"><h3>与经典理论对照</h3><p>特征整合理论为“联合搜索需要结合特征”提供依据。此任务的经典检查是中性提示下，联合搜索是否表现出更大的集合大小成本；不是要求得到固定毫秒数。</p><div class="note">${interpretation(classic)}</div><a class="source-link" href="https://doi.org/10.1016/0010-0285(80)90005-5" target="_blank" rel="noopener">Treisman & Gelade (1980) ↗</a></section></div><section class="panel"><h3>全部配对效应</h3>${effectTable(cs.filter(c=>c.kind==='fps'))}<p class="muted">提示收益差是被试内“差值之差”，不是完整重复测量ANOVA。多个比较未作多重检验校正，作为探索性描述，不自动判定假设成立。</p></section><section class="panel"><h3>12个条件的完整汇总</h3>${groupTable(groups)}</section>`}
function navPanel(ss,cs){let groups=S.cellGroups(ss,'nav'),series=['north','heading','aided'].map((mode,i)=>({name:names[mode],color:['#6c8753','#bd906b','#88a9ae'][i],values:[0,90,180,270].map(h=>groups.find(g=>g.key===`${mode}_${h}`).rt)})),base=cs.find(c=>c.id==='map-cost'),aid=cs.find(c=>c.id==='map-aid'),acc=cs.find(c=>c.id==='accuracy-gain'&&c.kind==='nav');return sectionTitle('02','城市导航：朝向改变了什么？','地图显示差异、方向转换与局部参照收益')+`<div class="analysis-metrics">${effectCard(base)}${effectCard(aid)}${effectCard(acc)}</div><div class="two-col"><section class="panel"><h3>实际朝向 × 地图模式</h3>${linePlot(series,[0,90,180,270],'RT / ms',['朝北','朝东','朝南','朝西'])}<p class="muted">航向上条件的骑手在屏幕中始终朝上；横轴指城市坐标中的实际朝向。</p></section><section class="panel"><h3>方向参照 · 同一被试的变化</h3>${pairedPlot(aid)}</section></div><section class="panel"><h3>各朝向与整体的配对比较</h3>${effectTable(cs.filter(c=>c.kind==='nav'))}</section><div class="two-col"><section class="panel"><h3>改进方向的描述</h3><div class="note">${interpretation(aid)}</div><p>同时对照正确率收益。若更快却更多误判，需讨论速度—准确率权衡，而不能只报告反应时间优势。</p></section><section class="panel"><h3>与原研究对照</h3><p>Aretz研究讨论北向上布局稳定与航向上自我视角对应的不同优势。本项目只检查即时转向，不包含认知地图学习；不能据此说航向上或北向上在所有导航任务中更好。</p><p>“施工通知”只作各条件一致的情境包装，没有独立操纵施工因素，因此不报告施工效应。</p><a class="source-link" href="https://doi.org/10.1177/001872089103300107" target="_blank" rel="noopener">Aretz (1991) ↗</a></section></div><section class="panel"><h3>12个条件的完整汇总</h3>${groupTable(groups)}</section>`}
function qualityPanel(selected){let q=S.quality(selected.included),reasons={};for(let a of selected.audit)reasons[a.reason]=(reasons[a.reason]||0)+1;return sectionTitle('03','先检查数据，再解释效应。','记录纳入、反应时间可用性与顺序检查')+`<section class="panel"><h3>记录筛选流程</h3><div class="quality-flow"><div><strong>${selected.uniqueCount}</strong><span>去重后的会话</span></div><div><strong>${selected.included.length}</strong><span>纳入分析</span></div><div><strong>${selected.audit.length}</strong><span>未纳入</span></div><div><strong>${selected.repeated}</strong><span>同一会话重复来源</span></div></div><p>${Object.entries(reasons).map(([k,n])=>`${esc(k)} ${n}条`).join(' · ')||'暂无需要排除的会话。'} 所有本机原始记录仍可导出；分析筛选不会删除数据。</p></section><section class="panel"><h3>逐被试的数据质量</h3>${q.length?`<div class="table-wrap"><table><tr><th>编号/任务</th><th>正式记录</th><th>中断</th><th>有效试次</th><th>错误*</th><th>超时</th><th>过快正确</th><th>RT可用</th><th>无RT条件</th></tr>${q.map(x=>`<tr><td>${esc(x.participant)} / ${labels[x.experiment]}</td><td>${x.raw}</td><td>${x.interrupted}</td><td>${x.valid}</td><td>${x.wrong}</td><td>${x.timeout}</td><td>${x.fast}</td><td>${x.usable}</td><td>${x.emptyCells}</td></tr>`).join('')}</table></div><p class="muted">* 错误列不含超时。过快正确指RT&lt;150ms。中断不进入正确率分母；错误/超时进入正确率分母但不进入RT分析。没有正确RT的条件保留为空，不以0填补。</p>`:empty('尚无正式数据质量记录')}</section><section class="panel"><h3>任务顺序与显示模式顺序</h3>${q.length?`<div class="table-wrap"><table><tr><th>编号</th><th>任务</th><th>开始时记录的任务顺序</th><th>导航模式顺序</th></tr>${q.map(x=>`<tr><td>${esc(x.participant)}</td><td>${labels[x.experiment]}</td><td>${esc(x.order)}</td><td>${esc(x.modeOrder)}</td></tr>`).join('')}</table></div>`:empty('等待顺序记录')}<p>这张表用于检查是否所有人都以同样顺序完成。编号哈希不保证小样本自动均衡，解释结果时需考虑练习与疲劳。</p></section><section class="panel"><h3>未纳入记录</h3>${selected.audit.length?`<div class="table-wrap"><table><tr><th>编号</th><th>任务</th><th>原因</th></tr>${selected.audit.map(x=>`<tr><td>${esc(x.session?.participant)}</td><td>${esc(labels[x.session?.experiment]||x.session?.experiment)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table></div>`:'<p class="muted">当前没有未纳入记录。</p>'}</section>`}
function methods(){return `<section class="panel"><h3>统计口径与解释边界</h3><p>分析单位是被试。每个细分条件先算该被试正确试次RT中位数；涉及多个细分条件时等权平均这些中位数，缺少任一必要条件则该被试不进入对应比较。正确率按条件计算后等权平均。每个比较显示实际配对人数。</p><p>95%区间=被试间均值±t临界值×标准误；配对效应用每人的A−B差值计算区间，d<sub>z</sub>=差值均值÷差值样本SD。n&lt;2不计算区间，零方差时d<sub>z</sub>不定义。区间依赖被试间独立与均值/差值分布适用t方法的假设；小样本难检验假设，区间仅供谨慎描述。df≤30使用临界值表，df&gt;30使用近似展开。</p><p>正确率采用未截断的t区间，可能越过0—100%；这说明小样本正态近似有限，不表示实际概率越界。图中误差线是组均值区间，不是单次反应的波动范围。</p><p>所有新增配对比较均作为探索性结果展示，未计算p值或作多重比较校正。不能在看到结果后称作事前预测。网页仅生成数据描述，最终结论需由研究者核对原论文、正式预测与真实数据后撰写。</p><div class="note warning">当前为减半版：FPS细分组合5次、导航6次，低于课程每条件至少10次的要求。较少的试次也会降低个体条件估计的稳定性；完善分析不能替代足够的数据。</div></section>`}
function overview(selected,cs){let ss=selected.included,people=new Set(ss.map(s=>s.participant)),both=[...people].filter(p=>ss.filter(s=>s.participant===p).length===2).length;return `<div class="analysis-metrics"><div class="metric"><span>完成射击的人数</span><strong>${ss.filter(s=>s.experiment==='fps').length}</strong><small>课程目标 ≥5名他人</small></div><div class="metric"><span>完成导航的人数</span><strong>${ss.filter(s=>s.experiment==='nav').length}</strong><small>课程目标 ≥5名他人</small></div><div class="metric"><span>两项均完成</span><strong>${both}</strong><small>不把试次数当作人数</small></div></div>${!ss.length?`<section class="panel">${empty('分析框架已准备好，等待真实数据。','导入多名被试的本网站CSV/JSON，可生成曲线、个人斜率、配对效应与完整汇总表。下方各分析页可先查看结构。')}</section>`:''}<div class="two-col"><section class="panel"><span class="tag">FPS / 经典效应</span><h3>联合搜索的集合大小成本是否更大？</h3>${effectCard(cs.find(c=>c.id==='slope-cost'))}<p>${interpretation(cs.find(c=>c.id==='slope-cost'))}</p><button class="secondary" data-analysis="fps">查看射击完整分析 →</button></section><section class="panel"><span class="tag">NAVIGATION / 改进效应</span><h3>增加方向参照是否帮助转向判断？</h3>${effectCard(cs.find(c=>c.id==='map-aid'))}<p>${interpretation(cs.find(c=>c.id==='map-aid'))}</p><button class="secondary" data-analysis="nav">查看导航完整分析 →</button></section></div><section class="panel"><h3>这份分析会回答什么？</h3><div class="analysis-checks"><span>01　经典效应的方向与大小</span><span>02　改进前后同一人的变化</span><span>03　不同朝向／数量下的差异</span><span>04　速度提升是否伴随准确率下降</span><span>05　样本不确定性与个体差异</span><span>06　数据排除与缺失是否合理</span></div></section>${methods()}`}
function csvFile(rows,name){if(!rows.length){toast('暂无可导出的正式分析数据。');return}let keys=[...new Set(rows.flatMap(Object.keys))];let text='\uFEFF'+keys.join(',')+'\r\n'+rows.map(r=>keys.map(k=>{let v=String(r[k]??'');if(/^[=+@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'}).join(',')).join('\r\n');download(text,name,'text/csv;charset=utf-8')}
function exportTables(ss,cs){let rows=[];for(let kind of ['fps','nav'])for(let g of S.cellGroups(ss,kind))if(g.rt.n||g.accuracy.n)rows.push({table:'condition',experiment:kind,condition:g.key,n:g.rt.n,rt_mean_ms:g.rt.mean,rt_sd:g.rt.sd,ci_low:g.rt.low,ci_high:g.rt.high,accuracy_percent:g.accuracy.mean,accuracy_n:g.accuracy.n,usable_trials:g.usable});for(let c of cs)if(c.n)rows.push({table:'paired_effect',experiment:c.kind,condition:c.id,n:c.n,difference_mean:c.mean,ci_low:c.low,ci_high:c.high,dz:c.dz,unit:c.unit,positive:c.positive,negative:c.negative,tied:c.tied});csvFile(rows,'citylab-analysis-summary.csv')}
function exportParticipants(ss,cs){let rows=[];for(let s of ss)for(let c of S.cells(s))rows.push({table:'participant_condition',participant:s.participant,experiment:s.experiment,condition:c.key,rt_median_ms:c.rt,accuracy:c.accuracy,valid_trials:c.n,usable_rt:c.validRT});for(let c of cs)for(let p of c.pairs)rows.push({table:'participant_contrast',participant:p.participant,experiment:c.kind,condition:c.id,A:p.a,B:p.b,difference:p.diff,unit:c.unit});csvFile(rows,'citylab-participant-analysis.csv')}
function exportReport(ss,cs){if(!ss.length){toast('没有真实正式数据，暂不生成结果描述。');return}let text='# 城市任务实验室：数据描述草稿\n\n生成时间：'+new Date().toISOString()+'\n\n仅基于当前导入/本机真实记录，须研究者核对后使用。不是已完成的论文讨论。\n\n';for(let kind of ['fps','nav']){text+='## '+labels[kind]+'\n\n纳入人数：'+ss.filter(s=>s.experiment===kind).length+'。\n\n';for(let c of cs.filter(x=>x.kind===kind))text+=`- ${c.name}：n=${c.n}，平均差=${fmt(c.mean)} ${c.unit}，95% CI ${interval(c)}，dz=${fmt(c.dz,2)}。${interpretation(c)}\n`;text+='\n'}text+='## 需要本人补充\n\n- 与收数前预测是否一致及理由。\n- 速度和正确率是否存在权衡。\n- 与原论文的方法差异及经典效应方向比较。\n- 样本、条件试次偏少及顺序/设备限制。\n- 未纳入记录原因与复现实验改进建议。\n\n统计单位为被试；先算条件中位RT，再对相关条件等权平均。配对CI使用差值t区间；没有p值或多重校正，不自动宣布假设成立。\n';download(text,'citylab-results-draft.md','text/markdown;charset=utf-8')}
results=function(){setPage('results');let selected=S.select([...sessions,...imported]),ss=selected.included,cs=S.contrasts(ss);app.innerHTML=heading('让每一次反应，都有据可循。','ANALYSIS / RESEARCH DASHBOARD')+`<div class="analysis-toolbar"><div><button class="primary" id="import-button">＋ 导入被试数据</button><button class="secondary" id="export-all">原始 CSV</button><button class="secondary" id="export-json">原始 JSON</button></div><div><button class="secondary" id="summary-export">分析汇总 CSV</button><button class="secondary" id="participant-export">个人分析 CSV</button><button class="secondary" id="report-export">结果描述草稿 ↓</button></div><input type="file" id="import-file" accept=".csv,.json" multiple hidden></div><p class="muted">支持多选或分批导入本网站导出的CSV/JSON；同一会话自动去重。已载入外部会话 ${imported.length} 条。导入仅在当前页面内存中，刷新前请导出合并JSON。不会自动从课程后台拉取数据。</p><div class="analysis-tabs" role="group" aria-label="分析页面">${[['overview','分析总览'],['fps','射击搜索'],['nav','城市导航'],['quality','数据质量'],['records','原始记录']].map(([id,label])=>`<button class="${active===id?'selected':''}" data-analysis="${id}">${label}</button>`).join('')}</div>${active==='overview'?overview(selected,cs):active==='fps'?fpsPanel(ss,cs):active==='nav'?navPanel(ss,cs):active==='quality'?qualityPanel(selected):records()}<div class="bottom-note"><span>分析模块 v1.2.0 · 仅真实正式记录 · 探索性比较</span><a href="https://github.com/BNU-EngPsy-Fall26/sunlin202411061082" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></div>`;bind();document.querySelectorAll('[data-analysis]').forEach(b=>b.onclick=()=>{active=b.dataset.analysis;results()});document.querySelector('#import-button').onclick=()=>document.querySelector('#import-file').click();document.querySelector('#import-file').onchange=importFile;document.querySelector('#export-all').onclick=()=>exportCSV([...new Map([...sessions,...imported].filter(s=>!s.demo).map(s=>[[s.id,s.participant,s.experiment].join('|'),s])).values()]);document.querySelector('#export-json').onclick=()=>download(JSON.stringify([...new Map([...sessions,...imported].filter(s=>!s.demo).map(s=>[[s.id,s.participant,s.experiment].join('|'),cleanSession(s)])).values()],null,2),'citylab-combined-sessions.json','application/json');document.querySelector('#summary-export').onclick=()=>exportTables(ss,cs);document.querySelector('#participant-export').onclick=()=>exportParticipants(ss,cs);document.querySelector('#report-export').onclick=()=>exportReport(ss,cs);document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportCSV([sessions.find(s=>s.id===b.dataset.export)]));document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>upload(sessions.find(s=>s.id===b.dataset.upload),b))};
function records(){return `<section class="panel"><h3>本机原始记录</h3><p>旧版1.0.0/1.1.0射击颜色异常记录仍可导出，但不纳入分析或上传。体验记录不保存为正式研究数据。</p>${sessions.filter(s=>!s.demo).length?sessions.filter(s=>!s.demo).map(s=>`<div class="session-row"><div><strong>${esc(s.participant)} · ${labels[s.experiment]}</strong><small>${esc((s.started||'').slice(0,16))} · ${s.rows.length}条 · ${colorBugRecord(s)?'旧版颜色异常':s.completed?'已完成':'未完成'}</small></div><div><button class="secondary" data-export="${esc(s.id)}">CSV</button> <button class="secondary" data-upload="${esc(s.id)}" ${!s.completed||!config.project||colorBugRecord(s)?'disabled':''}>上传课程平台</button></div></div>`).join(''):empty('本机还没有正式记录')}<p class="muted">外部导入记录通过顶部按钮合并导出，不自动上传。</p></section>`}
importFile=async function(e){const files=[...e.target.files];if(!files.length)return;let additions=[];try{for(let f of files){let text=await f.text(),data=f.name.toLowerCase().endsWith('.csv')?parseCSV(text):JSON.parse(text);if(!Array.isArray(data)||data.some(s=>!s||!Array.isArray(s.rows)||typeof s.participant!=='string'||!['fps','nav'].includes(s.experiment)||typeof s.id!=='string'))throw Error(f.name+'：请选择本网站导出的逐试次CSV或会话JSON。');for(let s of data)for(let r of s.rows)if(!r.invalid&&r.phase==='formal'&&(!Number.isFinite(r.rt)||r.rt<0||typeof r.correct!=='boolean'))throw Error(f.name+'：反应时间或正确性字段异常。');additions.push(...data)}imported=[...new Map([...imported,...additions].map(s=>[[s.id,s.participant,s.experiment].join('|'),s])).values()];results();toast(`已导入 ${files.length} 个文件，共载入 ${imported.length} 条外部会话。`)}catch(err){toast('导入失败：'+err.message)}};
})();

</script></body></html>
